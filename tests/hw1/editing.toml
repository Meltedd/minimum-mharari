image = "../../image/build/minimum.img"
boot_rom = "../../bootloader/bootloader.bin"
max_ticks = 1200000

[[inputs]]
at_tick = 300000
uart = 0
data = "\bechx\bo one\n\u007fechx\u007fo two\n"

[assert]
uart0_contains = "msh> one\nmsh> two\nmsh> "
execution_lifecycle = "paused"
shutdown_lifecycle = "stopped"
